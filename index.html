<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식단 · 가계부 메모장</title>
<style>
  :root{
    --line:#d8d8d8; --text:#333; --muted:#888; --accent:#e7c95d;
    --blue:#dff0ff; --yellow:#fff4c9; --red:#ffe1e1; --bg:#fafafa;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--text);background:#fff}
  button,input,select{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #ddd}
  .topbar{height:64px;display:flex;align-items:center;gap:10px;padding:0 24px}
  .logo{font-weight:800;font-size:18px;margin-right:22px;white-space:nowrap}
  .tabs{display:flex;gap:4px}
  .tab{border:0;background:#f3f3f3;padding:10px 18px;border-radius:10px 10px 0 0;color:#666}
  .tab.active{background:#333;color:white;font-weight:700}
  main{flex:1;min-height:calc(100vh - 64px)}
  .page{display:none;height:calc(100vh - 64px)}
  .page.active{display:flex}
  .sidebar{width:245px;flex:0 0 245px;border-right:1px solid #ddd;background:#fcfcfc;padding:22px 18px;overflow:auto}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .content-head{padding:22px 26px 14px;border-bottom:1px solid #eee;background:#fff}
  .content-body{flex:1;overflow:auto;padding:22px 26px}
  h2{font-size:19px;margin:0 0 5px}
  .sub{font-size:12px;color:#999}
  .section-title{font-size:13px;font-weight:800;margin-bottom:10px}
  .category-row{display:flex;align-items:center;justify-content:space-between;margin:5px 0}
  .category-btn{flex:1;border:0;background:transparent;text-align:left;padding:8px;border-radius:7px}
  .category-btn:hover{background:#f0f0f0}
  .category-btn.selected{background:#fff1a8;font-weight:700}
  .chev{display:inline-block;width:18px;color:#777}
  .subcats{padding:0 0 5px 25px}
  .subcat-btn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;color:#666;border-radius:6px;font-size:13px}
  .subcat-btn:hover,.subcat-btn.selected{background:#eee;color:#222}
  .edit-cats{margin-top:18px;border-top:1px solid #eee;padding-top:14px}
  .mini-btn{border:1px solid #ccc;background:#fff;border-radius:6px;padding:5px 8px;font-size:11px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .primary{background:#333;color:white;border:0;border-radius:7px;padding:9px 14px;font-weight:700}
  .secondary{background:#fff;color:#333;border:1px solid #ccc;border-radius:7px;padding:8px 12px}
  .searchbox{display:flex;gap:6px;margin-top:12px}
  .searchbox select,.searchbox input{height:36px;border:1px solid #ccc;border-radius:6px;padding:0 9px}
  .searchbox input{flex:1;min-width:160px}
  .filter-note{font-size:11px;color:#999;margin-top:7px}
  .list-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
  .sort{border:1px solid #ccc;background:#fff;border-radius:6px;padding:7px 10px}
  .recipe-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .recipe-card{border:1px solid #ddd;border-radius:10px;padding:15px;background:#fff;min-height:145px;position:relative}
  .recipe-card:hover{box-shadow:0 3px 12px #00000010}
  .recipe-title{font-size:16px;font-weight:800;margin-right:50px}
  .recipe-meta{font-size:12px;color:#888;margin:5px 0 10px}
  .ingredients{font-size:12px;line-height:1.7;color:#555}
  .spicy{position:absolute;right:12px;top:12px;font-size:15px}
  .card-actions{position:absolute;right:10px;bottom:9px;display:flex;gap:4px}
  .card-actions button{font-size:10px;border:0;background:#f2f2f2;border-radius:5px;padding:4px 6px}
  .empty{padding:50px;text-align:center;color:#aaa;border:1px dashed #ddd;border-radius:10px}
  .pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px}
  .pagination button{border:1px solid #ccc;background:#fff;border-radius:5px;width:30px;height:30px}
  .pagination .current{background:#333;color:#fff;border-color:#333}
  .calendar-wrap{height:100%;display:flex;flex-direction:column}
  .calendar-head{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px;border-bottom:1px solid #eee}
  .month-title{font-size:18px;font-weight:800;min-width:150px;text-align:center}
  .arrow{border:0;background:#fff;font-size:20px;padding:3px 9px}
  .calendar{display:grid;grid-template-columns:repeat(7,1fr);flex:1;min-height:0}
  .dow,.day{border-right:1px solid #ddd;border-bottom:1px solid #ddd}
  .dow{height:34px;background:#fafafa;text-align:center;padding-top:8px;font-size:12px;font-weight:700}
  .day{min-width:0;overflow:auto;padding:7px}
  .date-num{font-size:12px;color:#777;margin-bottom:6px}
  .today .date-num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#333;color:#fff;align-items:center;justify-content:center}
  .meal-block{border-radius:6px;padding:5px 6px;margin:4px 0;font-size:11px;line-height:1.35;position:relative}
  .meal-breakfast{background:var(--blue)}
  .meal-lunch{background:var(--yellow)}
  .meal-dinner{background:var(--red)}
  .meal-custom{font-weight:600}
  .registered{font-weight:800}
  .meal-del{float:right;border:0;background:transparent;color:#888;padding:0 2px}
  .calendar-toolbar{display:flex;justify-content:flex-end;padding:10px 22px}
  .today-btn{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 9px;font-size:11px}
  .picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .filter-pill{border:1px solid #ccc;background:#fff;border-radius:7px;padding:8px 4px;font-size:12px}
  .filter-pill.active{background:#333;color:#fff;border-color:#333}
  .random-page{display:flex;min-height:100%;width:100%}
  .random-side{width:245px;border-right:1px solid #ddd;padding:22px;background:#fcfcfc;overflow:auto}
  .filter-group{margin-bottom:20px}
  .filter-group h3{font-size:13px;margin:0 0 9px}
  .random-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;position:relative}
  .random-card{width:min(520px,90%);min-height:260px;border:1px solid #ddd;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-shadow:0 8px 30px #0000000b}
  .random-card .emoji{font-size:48px;margin-bottom:12px}
  .random-card .big-title{font-size:28px;font-weight:900}
  .random-card .small-meta{color:#888;margin-top:8px}
  .random-btn{margin-top:22px;border:0;background:#333;color:#fff;border-radius:10px;padding:13px 25px;font-size:15px;font-weight:800}
  .history{margin-top:20px;color:#888;font-size:12px;text-align:center}
  .modal-backdrop{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:100}
  .modal-backdrop.open{display:flex}
  .modal{width:min(520px,calc(100% - 30px));max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 15px 50px #0005}
  .modal h3{margin:0 0 16px}
  .form-row{margin-bottom:12px}
  .form-row label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
  .form-row input,.form-row select{width:100%;height:38px;border:1px solid #ccc;border-radius:7px;padding:0 9px}
  .inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:18px}
  .custom-meals{border:1px solid #ddd;border-radius:8px;padding:9px}
  .custom-item{display:flex;gap:6px;align-items:center;margin:5px 0}
  .custom-item input{flex:1}
  .minus{width:25px;height:25px;border:0;background:#f0f0f0;border-radius:5px;color:#888}
  .add-custom{border:1px dashed #bbb;background:#fff;border-radius:6px;padding:6px 9px;font-size:11px;margin-top:5px}
  .yearmonth-picker{display:flex;gap:8px}
  .yearmonth-picker select{flex:1}
  .notice{font-size:12px;background:#fff9dc;border:1px solid #eee0a0;border-radius:7px;padding:8px;color:#74651e}
  .placeholder{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#999;height:100%;gap:10px}
  @media(max-width:800px){
    .sidebar,.random-side{width:190px;flex-basis:190px}
    .topbar{padding:0 10px}.logo{display:none}.tab{padding:9px 10px;font-size:12px}
    .recipe-list{grid-template-columns:1fr}
    .day{font-size:10px;padding:4px}
  }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="topbar">
    <div class="logo">🍳 식단 메모장</div>
    <div class="tabs">
      <button class="tab active" data-page="recipes">식단리스트</button>
      <button class="tab" data-page="calendar">월간식단</button>
      <button class="tab" data-page="ledger">가계부</button>
      <button class="tab" data-page="random">오늘 뭐먹지</button>
    </div>
  </div>
</header>

<main>
<section id="recipes" class="page active">
  <aside class="sidebar">
    <div class="section-title">카테고리 ▾</div>
    <div id="categoryTree"></div>
    <div class="edit-cats">
      <div class="section-title">카테고리 편집</div>
      <button class="mini-btn" onclick="addCategory()">＋ 대분류 추가</button>
      <button class="mini-btn" onclick="resetCategories()">기본값 복원</button>
    </div>
  </aside>
  <div class="content">
    <div class="content-head">
      <div class="toolbar">
        <div><h2>식단 리스트</h2><div class="sub">등록한 요리를 한눈에 관리하세요.</div></div>
        <div style="margin-left:auto"><button class="primary" onclick="openRecipeModal()">＋ 요리등록</button></div>
      </div>
      <div class="searchbox">
        <select id="searchType">
          <option value="name">요리명</option><option value="ingredient">재료명</option>
        </select>
        <input id="searchInput" placeholder="요리명 또는 재료명을 검색하세요">
        <button class="secondary" onclick="renderRecipes()">검색</button>
        <button class="secondary" onclick="clearSearch()">초기화</button>
      </div>
    </div>
    <div class="content-body">
      <div class="list-top">
        <span id="recipeCount" class="sub"></span>
        <select id="sortOrder" class="sort" onchange="renderRecipes()">
          <option value="new">최신순</option><option value="old">오래된순</option>
        </select>
      </div>
      <div id="recipeList" class="recipe-list"></div>
      <div id="recipePagination" class="pagination"></div>
    </div>
  </div>
</section>

<section id="calendar" class="page">
  <div class="content">
    <div class="content-head">
      <div class="toolbar">
        <div><h2>월간식단</h2><div class="sub">날짜별 아침 · 점심 · 저녁과 나만의 식단을 기록하세요.</div></div>
        <div style="margin-left:auto;display:flex;gap:7px">
          <button id="undoMealBtn" class="secondary" onclick="undoMealChange()" disabled>↶ 실행취소</button>
          <button id="redoMealBtn" class="secondary" onclick="redoMealChange()" disabled>↷ 복원</button>
          <button class="secondary" onclick="goToday()">오늘</button>
          <button class="primary" onclick="openMealModal()">＋ 식단 추가</button>
        </div>
      </div>
    </div>
    <div class="calendar-wrap">
      <div class="calendar-head">
        <button class="arrow" onclick="changeMonth(-1)">◀</button>
        <button class="arrow" onclick="openMonthModal()">📅</button>
        <div id="monthTitle" class="month-title"></div>
        <button class="arrow" onclick="changeMonth(1)">▶</button>
      </div>
      <div id="calendarGrid" class="calendar"></div>
    </div>
  </div>
</section>

<section id="ledger" class="page">
  <div class="placeholder">
    <div style="font-size:46px">💰</div>
    <h2>가계부</h2>
    <div>다음 단계에서 지출 · 수입 · 월별 통계를 연결할 수 있어요.</div>
  </div>
</section>

<section id="random" class="page">
  <div class="random-page">
    <aside class="random-side">
      <div class="section-title">오늘 뭐먹지 설정</div>
      <div class="filter-group">
        <h3>카테고리</h3>
        <div class="picker-grid" id="randomCategories"></div>
      </div>
      <div class="filter-group">
        <h3>요리종류</h3>
        <div id="randomTypes"></div>
      </div>
      <div class="filter-group">
        <h3>맵기정도</h3>
        <div id="randomSpicy"></div>
      </div>
      <div class="notice">※ 카테고리에서 <b>전체</b>를 선택하면 요리종류 필터는 사용할 수 없습니다.</div>
    </aside>
    <div class="random-main">
      <div class="random-card" id="randomCard">
        <div class="emoji">🍽️</div>
        <div class="big-title">오늘 뭐 먹지?</div>
        <div class="small-meta">왼쪽에서 조건을 설정하고 랜덤 메뉴를 뽑아보세요.</div>
      </div>
      <button class="random-btn" onclick="drawRandom()">🎲 랜덤 메뉴 돌리기</button>
      <div class="history" id="randomHistory"></div>
    </div>
  </div>
</section>
</main>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="backdropClose(event)">
  <div id="modalBox" class="modal"></div>
</div>

<script>
const defaultCategories = {
  "한식":["메인요리","반찬","국/찌개","한그릇요리"],
  "양식":["에피타이저","메인요리"],
  "중식":["메인요리","서브요리"],
  "일식":["메인요리","반찬","국/찌개","한그릇요리"],
  "디저트":["빵","쿠키","설탕"],
  "음료":[]
};
const spiceLevels = ["안매움","매콤도 가능","조금 매움","많이 매움"];
const mealColors = ["#e9e2ff","#e2f7df","#ffe9cc","#e3f0ff","#f9e0f0","#e8e8e8"];

let categories = JSON.parse(localStorage.getItem("dietCategories") || "null") || structuredClone(defaultCategories);
let recipes = JSON.parse(localStorage.getItem("dietRecipes") || "null") || [
  {id:crypto.randomUUID(),category:"한식",type:"메인요리",name:"닭볶음탕",spicy:"조금 매움",ingredients:"닭고기, 감자, 양파, 고추",created:Date.now()-3000},
  {id:crypto.randomUUID(),category:"한식",type:"반찬",name:"계란말이",spicy:"안매움",ingredients:"계란, 대파, 소금",created:Date.now()-2000},
  {id:crypto.randomUUID(),category:"일식",type:"한그릇요리",name:"규동",spicy:"안매움",ingredients:"소고기, 양파, 간장, 밥",created:Date.now()-1000}
];
let meals = JSON.parse(localStorage.getItem("dietMeals") || "{}");
let customMealTypes = JSON.parse(localStorage.getItem("customMealTypes") || "[]");
let collapsed = {};
let selectedCategory = "전체", selectedType = null;
let recipePage = 1, currentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let randomState = {category:"전체",type:null,spice:null,history:[]};
let mealUndoStack = [];
let mealRedoStack = [];
function cloneMeals(source){ return JSON.parse(JSON.stringify(source || {})); }
function pushMealHistory(){
  mealUndoStack.push(cloneMeals(meals));
  if(mealUndoStack.length > 50) mealUndoStack.shift();
  mealRedoStack = [];
  updateMealHistoryButtons();
}
function updateMealHistoryButtons(){
  const u=document.getElementById("undoMealBtn"), r=document.getElementById("redoMealBtn");
  if(u) u.disabled=mealUndoStack.length===0;
  if(r) r.disabled=mealRedoStack.length===0;
}
function restoreMealSnapshot(snapshot){
  meals=cloneMeals(snapshot); save(); renderCalendar(); updateMealHistoryButtons();
}
function undoMealChange(){
  if(!mealUndoStack.length)return;
  mealRedoStack.push(cloneMeals(meals));
  restoreMealSnapshot(mealUndoStack.pop());
}
function redoMealChange(){
  if(!mealRedoStack.length)return;
  mealUndoStack.push(cloneMeals(meals));
  restoreMealSnapshot(mealRedoStack.pop());
}

window._mealFormDate = new Date().toISOString().slice(0,10);
window._mealSlot = "아침";
window._mealInputMode = "direct";
window._mealSelectedRecipeIds = [];

function save(){
  localStorage.setItem("dietCategories",JSON.stringify(categories));
  localStorage.setItem("dietRecipes",JSON.stringify(recipes));
  localStorage.setItem("dietMeals",JSON.stringify(meals));
  localStorage.setItem("customMealTypes",JSON.stringify(customMealTypes));
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function spicyEmoji(level){
  return { "안매움":"","매콤도 가능":"🌶️","조금 매움":"🌶️🌶️","많이 매움":"🌶️🌶️🌶️" }[level] || "";
}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modalBackdrop").classList.add("open")}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("open")}
function backdropClose(e){if(e.target.id==="modalBackdrop")closeModal()}

document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active"); document.getElementById(btn.dataset.page).classList.add("active");
  if(btn.dataset.page==="recipes")renderRecipes();
  if(btn.dataset.page==="calendar")renderCalendar();
  if(btn.dataset.page==="random")renderRandomFilters();
}));

function renderCategoryTree(){
  const box=document.getElementById("categoryTree");
  box.innerHTML="";
  ["전체",...Object.keys(categories)].forEach(cat=>{
    if(cat==="전체"){
      const row=document.createElement("div"); row.className="category-row";
      row.innerHTML=`<button class="category-btn ${selectedCategory==="전체"?"selected":""}" onclick="selectCategory('전체')">전체</button>`;
      box.appendChild(row); return;
    }
    const row=document.createElement("div");row.className="category-row";
    row.innerHTML=`<button class="category-btn ${selectedCategory===cat?"selected":""}" onclick="selectCategory('${esc(cat)}')"><span class="chev">${collapsed[cat]?"▶":"▼"}</span>${esc(cat)}</button>`;
    box.appendChild(row);
    if(!collapsed[cat]){
      const sub=document.createElement("div");sub.className="subcats";
      categories[cat].forEach(t=>{
        const b=document.createElement("button");b.className=`subcat-btn ${selectedCategory===cat&&selectedType===t?"selected":""}`;b.textContent=t;
        b.onclick=()=>{selectedCategory=cat;selectedType=t;renderCategoryTree();renderRecipes()};sub.appendChild(b);
      });
      box.appendChild(sub);
    }
  });
}
function selectCategory(cat){
  if(cat==="전체"){selectedCategory="전체";selectedType=null}
  else {selectedCategory=cat;selectedType=null;collapsed[cat]=!collapsed[cat]}
  renderCategoryTree();renderRecipes();
}
function addCategory(){
  const name=prompt("추가할 대분류 이름을 입력하세요.");
  if(!name?.trim() || categories[name.trim()]) return;
  categories[name.trim()]=[];
  save();renderCategoryTree();
}
function resetCategories(){
  if(confirm("카테고리를 기본값으로 복원할까요?")){categories=structuredClone(defaultCategories);save();renderCategoryTree()}
}

function openRecipeModal(editId=null){
  const r=recipes.find(x=>x.id===editId);
  const cat=r?.category || selectedCategory==="전체"?"한식":selectedCategory;
  const type=r?.type || (categories[cat]?.[0]||"");
  openModal(`
    <h3>${r?"요리 수정":"요리 등록"}</h3>
    <div class="inline">
      <div class="form-row"><label>카테고리</label><select id="rCat">${Object.keys(categories).map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="form-row"><label>종류</label><select id="rType"></select></div>
    </div>
    <div class="form-row"><label>요리 이름</label><input id="rName" value="${esc(r?.name||"")}" placeholder="예: 김치찌개"></div>
    <div class="form-row"><label>맵기 정도</label><select id="rSpice">${spiceLevels.map(s=>`<option ${s===(r?.spicy||"안매움")?"selected":""}>${s}</option>`).join("")}</select></div>
    <div class="form-row"><label>재료</label><input id="rIng" value="${esc(r?.ingredients||"")}" placeholder="예: 돼지고기, 김치, 대파"></div>
    <div class="modal-actions"><button class="secondary" onclick="closeModal()">취소</button><button class="primary" onclick="saveRecipe('${editId||""}')">${r?"수정":"등록"}</button></div>
  `);
  const sel=document.getElementById("rCat"), typeSel=document.getElementById("rType");
  function sync(){typeSel.innerHTML=(categories[sel.value]||[]).map(t=>`<option ${t===type?"selected":""}>${esc(t)}</option>`).join("")}
  sel.addEventListener("change",sync);sync();
}
function saveRecipe(id){
  const category=document.getElementById("rCat").value, type=document.getElementById("rType").value;
  const name=document.getElementById("rName").value.trim(), spicy=document.getElementById("rSpice").value, ingredients=document.getElementById("rIng").value.trim();
  if(!name){alert("요리 이름을 입력해주세요.");return}
  if(id){const r=recipes.find(x=>x.id===id);Object.assign(r,{category,type,name,spicy,ingredients})}
  else recipes.push({id:crypto.randomUUID(),category,type,name,spicy,ingredients,created:Date.now()});
  save();closeModal();renderRecipes();
}
function deleteRecipe(id){if(confirm("이 요리를 삭제할까요?")){recipes=recipes.filter(r=>r.id!==id);save();renderRecipes()}}

function renderRecipes(){
  renderCategoryTree();
  const q=document.getElementById("searchInput").value.trim().toLowerCase(), st=document.getElementById("searchType").value;
  let arr=recipes.filter(r=>(selectedCategory==="전체"||r.category===selectedCategory)&&(selectedType==null||r.type===selectedType));
  if(q)arr=arr.filter(r=>(st==="name"?r.name:r.ingredients).toLowerCase().includes(q));
  arr.sort((a,b)=>(document.getElementById("sortOrder").value==="new"?b.created-a.created:a.created-b.created));
  const per=5,total=Math.max(1,Math.ceil(arr.length/per));recipePage=Math.min(recipePage,total);
  const slice=arr.slice((recipePage-1)*per,recipePage*per);
  document.getElementById("recipeCount").textContent=`총 ${arr.length}개`;
  document.getElementById("recipeList").innerHTML=slice.length?slice.map(r=>`
    <article class="recipe-card">
      <div class="recipe-title">${esc(r.name)}</div>
      <div class="spicy">${spicyEmoji(r.spicy)}</div>
      <div class="recipe-meta"><strong>${esc(r.category)} · ${esc(r.type)}</strong> · ${esc(r.spicy)}</div>
      <div class="ingredients">🥕 ${esc(r.ingredients||"재료 미입력")}</div>
      <div class="card-actions"><button onclick="openRecipeModal('${r.id}')">수정</button><button onclick="deleteRecipe('${r.id}')">삭제</button></div>
    </article>`).join(""):`<div class="empty" style="grid-column:1/-1">조건에 맞는 요리가 없어요.</div>`;
  document.getElementById("recipePagination").innerHTML=Array.from({length:total},(_,i)=>`<button class="${i+1===recipePage?"current":""}" onclick="recipePage=${i+1};renderRecipes()">${i+1}</button>`).join("");
}
function clearSearch(){document.getElementById("searchInput").value="";recipePage=1;renderRecipes()}

function formatDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function formatMonth(d){return `${d.getFullYear()}년 ${d.getMonth()+1}월`}
function customMealColor(slot){
  const palette=["#f9dfe9","#e9ddff","#dff5ea","#ffe5cf","#e3e6ff","#f4e1f7","#e4f1f4","#f8e5d5"];
  let idx=customMealTypes.indexOf(slot);
  if(idx<0) idx=[...slot].reduce((a,c)=>a+c.charCodeAt(0),0)%palette.length;
  return palette[idx%palette.length];
}

function renderCalendar(){
  document.getElementById("monthTitle").textContent=formatMonth(currentMonth);
  const grid=document.getElementById("calendarGrid"), y=currentMonth.getFullYear(),m=currentMonth.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0), start=first.getDay(), days=last.getDate();
  let h=["일","월","화","수","목","금","토"].map(x=>`<div class="dow">${x}</div>`).join("");
  for(let i=0;i<start;i++)h+=`<div class="day"></div>`;
  const today=formatDate(new Date());
  for(let n=1;n<=days;n++){
    const date=new Date(y,m,n), key=formatDate(date), list=meals[key]||[];
    h+=`<div class="day ${key===today?"today":""}"><div class="date-num">${n}</div>${list.map((x,idx)=>{
      const cls=x.slot==="아침"?"meal-breakfast":x.slot==="점심"?"meal-lunch":x.slot==="저녁"?"meal-dinner":"meal-custom";
      const registered=recipes.some(r=>r.name===x.name);
      const color=x.slot==="아침"||x.slot==="점심"||x.slot==="저녁"?"":` style="background:${customMealColor(x.slot)}"`;
      return `<div class="meal-block ${cls} ${registered?"registered":""}"${color}>${esc(x.slot)} · ${esc(x.name)} <button class="meal-del" onclick="event.stopPropagation();deleteMeal('${key}',${idx})">×</button></div>`
    }).join("")}</div>`;
  }
  grid.innerHTML=h;
}
function changeMonth(n){currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+n,1);renderCalendar()}
function goToday(){const d=new Date();currentMonth=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar()}
function openMonthModal(){
  const y=currentMonth.getFullYear(),m=currentMonth.getMonth();
  openModal(`<h3>원하는 월로 이동</h3><div class="yearmonth-picker"><select id="pickYear">${Array.from({length:11},(_,i)=>{let yy=y-5+i;return `<option ${yy===y?"selected":""}>${yy}</option>`}).join("")}</select><select id="pickMonth">${Array.from({length:12},(_,i)=>`<option value="${i}" ${i===m?"selected":""}>${i+1}월</option>`).join("")}</select></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">취소</button><button class="primary" onclick="jumpMonth()">이동</button></div>`)
}
function jumpMonth(){currentMonth=new Date(+document.getElementById("pickYear").value,+document.getElementById("pickMonth").value,1);closeModal();renderCalendar()}
function openMealModal(){
  const today=formatDate(new Date());
  const savedDate=window._mealFormDate || today;
  const savedSlot=window._mealSlot || "아침";
  openModal(`
    <h3>식단 추가</h3>
    <div class="form-row"><label>날짜</label><input id="mDate" type="date" value="${savedDate}"></div>
    <div class="form-row"><label>식사 항목</label><div id="mealSlotButtons" class="picker-grid">
      ${["아침","점심","저녁"].map(x=>`<button type="button" class="filter-pill ${savedSlot===x?"active":""}" data-slot="${esc(x)}">${x}</button>`).join("")}
    </div></div>
    <div class="form-row"><label>기타 추가 항목</label><div class="custom-meals" id="customMeals">
      ${customMealTypes.map((x,i)=>`<div class="custom-item"><button type="button" class="minus" data-custom-index="${i}">−</button><span style="flex:1">${esc(x)}</span><button type="button" class="filter-pill custom-slot-btn ${savedSlot===x?"active":""}" data-slot="${esc(x)}">${esc(x)}</button></div>`).join("")}
      <button type="button" class="add-custom" id="addCustomTypeBtn">＋ 기타추가</button>
    </div></div>
    <div class="form-row"><label>요리 이름 <span style="font-weight:400;color:#999">— 여러 개 추가 가능</span></label>
      <div class="picker-grid" style="grid-template-columns:1fr 1fr;margin-bottom:8px">
        <button type="button" id="mealInputModeDirect" class="filter-pill ${window._mealInputMode!=="list"?"active":""}">직접 입력</button>
        <button type="button" id="mealInputModeList" class="filter-pill ${window._mealInputMode==="list"?"active":""}">등록 요리에서 선택</button>
      </div>
      <div id="mealDirectBox" style="display:${window._mealInputMode==="list"?"none":"block"}"><div id="directMealRows"></div><button type="button" class="add-custom" id="addDirectMealBtn">＋ 요리 추가</button></div>
      <div id="mealListBox" style="display:${window._mealInputMode==="list"?"block":"none"}">
        <div class="inline" style="margin-bottom:8px"><select id="mCat">${Object.keys(categories).map(c=>`<option>${esc(c)}</option>`).join("")}</select><select id="mType"></select></div>
        <select id="mRecipeSelect" style="width:100%;height:38px;border:1px solid #ccc;border-radius:7px;padding:0 9px"><option value="">요리를 선택하세요</option></select>
        <div class="filter-note">카테고리와 종류를 선택한 뒤 요리를 하나씩 담아 여러 개를 추가할 수 있습니다.</div>
        <button type="button" class="add-custom" id="addSelectedRecipeBtn">＋ 선택 요리 추가</button>
        <div id="selectedRecipeRows" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="modal-actions"><button type="button" class="secondary" id="mealCancelBtn">취소</button><button type="button" class="primary" id="mealSaveBtn">등록</button></div>
  `);
  window._mealSlot=savedSlot;
  window._mealFormDate=savedDate;
  window._mealSelectedRecipeIds=[];
  document.getElementById("mDate").addEventListener("change",e=>window._mealFormDate=e.target.value);
  document.querySelectorAll("#mealSlotButtons [data-slot], #customMeals .custom-slot-btn").forEach(btn=>btn.addEventListener("click",()=>selectMealSlot(btn,btn.dataset.slot)));
  document.querySelectorAll("#customMeals [data-custom-index]").forEach(btn=>btn.addEventListener("click",()=>removeCustomType(Number(btn.dataset.customIndex))));
  document.getElementById("addCustomTypeBtn").addEventListener("click",addCustomType);
  document.getElementById("mealInputModeDirect").addEventListener("click",()=>setMealInputMode("direct"));
  document.getElementById("mealInputModeList").addEventListener("click",()=>setMealInputMode("list"));
  document.getElementById("addDirectMealBtn").addEventListener("click",()=>addDirectMealRow());
  document.getElementById("addSelectedRecipeBtn").addEventListener("click",addSelectedRecipe);
  document.getElementById("mealCancelBtn").addEventListener("click",closeModal);
  document.getElementById("mealSaveBtn").addEventListener("click",saveMeal);
  document.getElementById("mCat").addEventListener("change",e=>updateMealTypeOptions(e.target.value));
  document.getElementById("mType").addEventListener("change",updateMealRecipeList);
  updateMealTypeOptions(document.getElementById("mCat").value);
  addDirectMealRow();
  if(window._mealInputMode==="list")renderSelectedRecipes();
}

function selectMealSlot(btn,slot){
  document.querySelectorAll("#mealSlotButtons .filter-pill, #customMeals .custom-slot-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  window._mealSlot=slot;
}
function addCustomType(){
  const name=prompt("추가할 항목 이름을 입력하세요. 예: 간식, 야식");
  if(!name?.trim()||customMealTypes.includes(name.trim()))return;
  customMealTypes.push(name.trim());
  save();
  openMealModal();
}
function removeCustomType(i){
  customMealTypes.splice(i,1);
  save();
  openMealModal();
}

function setMealInputMode(mode){
  window._mealInputMode=mode;
  const direct=document.getElementById("mealDirectBox"), list=document.getElementById("mealListBox");
  const directBtn=document.getElementById("mealInputModeDirect"), listBtn=document.getElementById("mealInputModeList");
  if(!direct)return;
  direct.style.display=mode==="direct"?"block":"none";
  list.style.display=mode==="list"?"block":"none";
  directBtn.classList.toggle("active",mode==="direct");
  listBtn.classList.toggle("active",mode==="list");
  if(mode==="list") updateMealTypeOptions(document.getElementById("mCat").value);
}

function addDirectMealRow(value=""){
  const box=document.getElementById("directMealRows");
  if(!box)return;
  const row=document.createElement("div");
  row.className="custom-item";
  row.innerHTML=`<input class="direct-meal-input" value="${esc(value)}" placeholder="요리 이름 입력"><button class="minus" onclick="this.parentElement.remove()">−</button>`;
  box.appendChild(row);
}

function addSelectedRecipe(){
  const id=document.getElementById("mRecipeSelect")?.value;
  if(!id)return;
  if(!window._mealSelectedRecipeIds.includes(id)) window._mealSelectedRecipeIds.push(id);
  renderSelectedRecipes();
}

function renderSelectedRecipes(){
  const box=document.getElementById("selectedRecipeRows");
  if(!box)return;
  box.innerHTML=window._mealSelectedRecipeIds.map(id=>{
    const r=recipes.find(x=>x.id===id);
    return r?`<div class="custom-item"><span style="flex:1">🍳 ${esc(r.name)} <span class="sub">· ${esc(r.category)} · ${esc(r.type)}</span></span><button class="minus" onclick="removeSelectedRecipe('${r.id}')">−</button></div>`:"";
  }).join("");
}

function removeSelectedRecipe(id){
  window._mealSelectedRecipeIds=window._mealSelectedRecipeIds.filter(x=>x!==id);
  renderSelectedRecipes();
}
function updateMealTypeOptions(category){
  const typeSel=document.getElementById("mType");
  if(!typeSel)return;
  const types=categories[category]||[];
  typeSel.innerHTML=`<option value="">전체 종류</option>`+types.map(t=>`<option>${esc(t)}</option>`).join("");
  updateMealRecipeList();
}

function updateMealRecipeList(){
  const cat=document.getElementById("mCat")?.value;
  const type=document.getElementById("mType")?.value;
  const select=document.getElementById("mRecipeSelect");
  if(!select)return;

  let arr=recipes.filter(r=>r.category===cat && (!type || r.type===type));
  arr.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  select.innerHTML=`<option value="">요리를 선택하세요</option>`+
    arr.map(r=>`<option value="${esc(r.id)}">${esc(r.name)} · ${esc(r.type)}</option>`).join("");
}

function saveMeal(){
  const date=document.getElementById("mDate").value;
  window._mealFormDate=date;

  let names=[];
  if(window._mealInputMode==="list"){
    names=window._mealSelectedRecipeIds
      .map(id=>recipes.find(r=>r.id===id)?.name)
      .filter(Boolean);
  }else{
    names=[...document.querySelectorAll(".direct-meal-input")]
      .map(input=>input.value.trim())
      .filter(Boolean);
  }

  if(!date||!names.length){
    alert("날짜와 요리 이름을 하나 이상 입력해주세요.");
    return;
  }

  pushMealHistory();
  if(!meals[date])meals[date]=[];
  names.forEach(name=>meals[date].push({slot:window._mealSlot,name}));
  save();
  updateMealHistoryButtons();

  currentMonth=new Date(date+"T00:00:00");
  currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth(),1);
  closeModal();
  renderCalendar();

  // 다음 식단 추가 시에도 방금 사용한 날짜와 식사 항목을 유지
  window._mealFormDate=date;
}
function deleteMeal(key,i){
  if(!meals[key] || !meals[key][i])return;
  pushMealHistory();
  meals[key].splice(i,1);
  if(!meals[key].length)delete meals[key];
  save();renderCalendar();updateMealHistoryButtons();
}

function renderRandomFilters(){
  const cbox=document.getElementById("randomCategories");
  cbox.innerHTML=["전체",...Object.keys(categories)].map(c=>`<button class="filter-pill ${randomState.category===c?"active":""}" onclick="setRandomCategory('${esc(c)}')">${esc(c)}</button>`).join("");
  const tbox=document.getElementById("randomTypes");
  if(randomState.category==="전체"){
    tbox.innerHTML=`<div class="sub">카테고리를 먼저 설정해주세요.</div>`;
  }else{
    tbox.innerHTML=(categories[randomState.category]||[]).map(t=>`<button class="filter-pill ${randomState.type===t?"active":""}" style="display:block;width:100%;margin:5px 0;text-align:left" onclick="setRandomType('${esc(t)}')">${esc(t)}</button>`).join("") || `<div class="sub">등록된 종류가 없습니다.</div>`;
  }
  const sbox=document.getElementById("randomSpicy");
  sbox.innerHTML=spiceLevels.map(s=>`<button class="filter-pill ${randomState.spice===s?"active":""}" style="display:block;width:100%;margin:5px 0;text-align:left" onclick="setRandomSpice('${esc(s)}')">${spicyEmoji(s)||"▫️"} ${esc(s)}</button>`).join("");
}
function setRandomCategory(c){randomState.category=c;randomState.type=null;renderRandomFilters()}
function setRandomType(t){if(randomState.category==="전체"){alert("카테고리를 먼저 설정해주세요.");return}randomState.type=randomState.type===t?null:t;renderRandomFilters()}
function setRandomSpice(s){randomState.spice=randomState.spice===s?null:s;renderRandomFilters()}
function drawRandom(){
  let arr=recipes.filter(r=>randomState.category==="전체"||r.category===randomState.category);
  if(randomState.category!=="전체"&&randomState.type)arr=arr.filter(r=>r.type===randomState.type);
  if(randomState.spice)arr=arr.filter(r=>r.spicy===randomState.spice);
  if(!arr.length){alert("조건에 맞는 등록 요리가 없습니다.");return}
  const r=arr[Math.floor(Math.random()*arr.length)];
  randomState.history.unshift(r.name);randomState.history=randomState.history.slice(0,5);
  document.getElementById("randomCard").innerHTML=`<div class="emoji">${spicyEmoji(r.spicy)||"🍽️"}</div><div class="big-title">${esc(r.name)}</div><div class="small-meta">${esc(r.category)} · ${esc(r.type)} · ${esc(r.spicy)}</div><div class="small-meta">재료: ${esc(r.ingredients||"미입력")}</div>`;
  document.getElementById("randomHistory").textContent="최근 추천: "+randomState.history.join("  ·  ");
}

renderCategoryTree();renderRecipes();renderCalendar();renderRandomFilters();updateMealHistoryButtons();
</script>
</body>
</html>
