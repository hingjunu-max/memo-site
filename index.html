<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>식단 · 가계부 메모장</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Google AdSense -->
<script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2640514609523625"
  crossorigin="anonymous"></script>

<style>
:root{
  --line:#e5e5e5;
  --text:#222;
  --muted:#888;
  --accent:#e7c95d;
  --blue:#f4f8ff;
  --yellow:#fffcf0;
  --red:#fff5f5;
  --bg:#fafafa;
  --blue-hdr:#e1eeff;
  --yellow-hdr:#fff3cc;
  --red-hdr:#ffe0e0;
  --custom-hdr:#ebebeb;
  --blue-txt:#1a56a3;
  --yellow-txt:#996b00;
  --red-txt:#b32626;
  --custom-txt:#444;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:var(--text);
  background:#fff;
  -webkit-tap-highlight-color:transparent
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #eee
}

.topbar{
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
  overflow:hidden
}

.logo{
  font-weight:800;
  font-size:17px;
  white-space:nowrap
}

.tabs{
  display:flex;
  gap:4px;
  overflow-x:auto;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch
}

.tabs::-webkit-scrollbar{
  display:none
}

.tab{
  border:0;
  background:#f3f3f3;
  padding:8px 14px;
  border-radius:8px 8px 0 0;
  color:#666;
  font-size:13px;
  flex-shrink:0
}

.tab.active{
  background:#333;
  color:#fff;
  font-weight:700
}

.auth-area{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  white-space:nowrap
}

.auth-area span{
  color:#666;
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis
}

main{
  flex:1;
  display:flex;
  flex-direction:column
}

.page{
  display:none;
  flex:1;
  width:100%
}

.page.active{
  display:flex
}

.sidebar{
  width:245px;
  flex:0 0 245px;
  border-right:1px solid #ddd;
  background:#fcfcfc;
  padding:22px 18px;
  overflow:auto
}

.content{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column
}

.content-head{
  padding:16px 20px;
  border-bottom:1px solid #eee;
  background:#fff
}

.content-body{
  flex:1;
  overflow:auto;
  padding:16px 20px
}

h2{
  font-size:18px;
  margin:0 0 4px
}

.sub{
  font-size:12px;
  color:#999
}

.section-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:10px
}

.category-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:4px 0
}

.category-btn{
  flex:1;
  border:0;
  background:transparent;
  text-align:left;
  padding:8px;
  border-radius:7px;
  font-size:14px
}

.category-btn:hover{
  background:#f0f0f0
}

.category-btn.selected{
  background:#fff1a8;
  font-weight:700
}

.chev{
  display:inline-block;
  width:18px;
  color:#777
}

.subcats{
  padding:0 0 5px 25px
}

.subcat-btn{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:5px 8px;
  color:#666;
  border-radius:6px;
  font-size:13px
}

.subcat-btn:hover,
.subcat-btn.selected{
  background:#eee;
  color:#222
}

.edit-cats{
  margin-top:18px;
  border-top:1px solid #eee;
  padding-top:14px
}

.mini-btn{
  border:1px solid #ccc;
  background:#fff;
  border-radius:6px;
  padding:5px 8px;
  font-size:11px
}

.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

.primary{
  background:#333;
  color:#fff;
  border:0;
  border-radius:7px;
  padding:8px 12px;
  font-weight:700;
  font-size:13px
}

.secondary{
  background:#fff;
  color:#333;
  border:1px solid #ccc;
  border-radius:7px;
  padding:7px 10px;
  font-size:12px
}

.google-btn{
  background:#4285F4;
  color:#fff;
  border:0;
  border-radius:7px;
  padding:9px 14px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  margin-top:10px
}

.searchbox{
  display:flex;
  gap:6px;
  margin-top:10px
}

.searchbox select,
.searchbox input{
  height:34px;
  border:1px solid #ccc;
  border-radius:6px;
  padding:0 8px;
  font-size:12px
}

.searchbox input{
  flex:1;
  min-width:120px
}

.list-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.sort{
  border:1px solid #ccc;
  background:#fff;
  border-radius:6px;
  padding:5px 8px;
  font-size:12px
}

.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:10px
}

.recipe-card{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  background:#fff;
  min-height:150px;
  position:relative
}

.recipe-card:hover{
  box-shadow:0 3px 10px #0000000a
}

.recipe-title{
  font-size:15px;
  font-weight:800;
  margin-right:45px
}

.recipe-meta{
  font-size:11px;
  color:#888;
  margin:4px 0 8px
}

.ingredients{
  font-size:11px;
  line-height:1.5;
  color:#555
}

.recipe-link{
  font-size:11px;
  color:#1769aa;
  text-decoration:underline;
  display:inline-block;
  margin-top:6px;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.spicy{
  position:absolute;
  right:10px;
  top:10px;
  font-size:14px
}

.card-actions{
  position:absolute;
  right:8px;
  bottom:8px;
  display:flex;
  gap:4px
}

.card-actions button{
  font-size:11px;
  border:0;
  background:#f2f2f2;
  border-radius:5px;
  padding:4px 7px
}

.empty{
  padding:40px;
  text-align:center;
  color:#aaa;
  border:1px dashed #ddd;
  border-radius:10px
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  margin-top:16px
}

.pagination button{
  border:1px solid #ccc;
  background:#fff;
  border-radius:5px;
  width:30px;
  height:30px;
  font-size:12px
}

.pagination .current{
  background:#333;
  color:#fff;
  border-color:#333
}

.calendar-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  background:#fff;
  padding:4px
}

.calendar-head{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:8px 4px;
  border-bottom:1px solid #eee
}

.month-title{
  font-size:17px;
  font-weight:800;
  min-width:120px;
  text-align:center
}

.arrow{
  border:0;
  background:#fff;
  font-size:16px;
  padding:4px 8px
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  flex:1;
  min-height:500px;
  border-top:1px solid #eee;
  border-left:1px solid #eee
}

.dow,
.day{
  border-right:1px solid #eee;
  border-bottom:1px solid #eee
}

.dow{
  height:28px;
  background:#fafafa;
  text-align:center;
  padding-top:4px;
  font-size:12px;
  font-weight:700
}

.dow:first-child{
  color:#e53935
}

.dow:last-child{
  color:#1e88e5
}

.day{
  min-height:90px;
  overflow-y:auto;
  padding:2px;
  display:flex;
  flex-direction:column;
  gap:1px;
  cursor:pointer
}

.day:hover{
  background-color:#f9f9f9
}

.date-num{
  font-size:11px;
  color:#444;
  margin-bottom:2px;
  font-weight:700;
  padding-left:2px
}

.day:first-child .date-num{
  color:#e53935
}

.day:last-child .date-num{
  color:#1e88e5
}

.today .date-num{
  display:inline-flex;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#333;
  color:#fff;
  align-items:center;
  justify-content:center;
  font-weight:700;
  padding-left:0
}

.meal-group{
  border-radius:3px;
  overflow:hidden;
  margin-bottom:3px;
  font-size:11px;
  border:0;
  background:transparent;
  cursor:pointer
}

.meal-group-header{
  padding:1px 3px;
  font-weight:800;
  font-size:10px;
  letter-spacing:-.5px;
  line-height:1.2
}

.meal-group-header.meal-breakfast{
  color:var(--blue-txt);
  background:var(--blue-hdr)
}

.meal-group-header.meal-lunch{
  color:var(--yellow-txt);
  background:var(--yellow-hdr)
}

.meal-group-header.meal-dinner{
  color:var(--red-txt);
  background:var(--red-hdr)
}

.meal-group-header.meal-custom{
  color:var(--custom-txt);
  background:var(--custom-hdr)
}

.meal-group-body{
  display:flex;
  flex-direction:column;
  padding:1px 0
}

.meal-group-body.meal-breakfast{
  background:var(--blue)
}

.meal-group-body.meal-lunch{
  background:var(--yellow)
}

.meal-group-body.meal-dinner{
  background:var(--red)
}

.meal-group-body.meal-custom{
  background:#f8f8f8
}

.meal-item{
  padding:1px 2px;
  line-height:1.25;
  position:relative;
  font-size:10.5px;
  color:#222;
  letter-spacing:-.6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.meal-item-text{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1
}

.meal-item.registered{
  font-weight:600
}

.random-page{
  display:flex;
  flex:1;
  width:100%
}

.random-side{
  width:245px;
  border-right:1px solid #ddd;
  padding:22px;
  background:#fcfcfc;
  overflow:auto
}

.filter-group{
  margin-bottom:20px
}

.filter-group h3{
  font-size:13px;
  margin:0 0 9px
}

.random-main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative
}

.random-card{
  width:min(520px,95%);
  min-height:200px;
  border:1px solid #ddd;
  border-radius:16px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-shadow:0 8px 30px #0000000b;
  text-align:center
}

.random-card .emoji{
  font-size:38px;
  margin-bottom:8px
}

.random-card .big-title{
  font-size:22px;
  font-weight:900
}

.random-card .small-meta{
  color:#888;
  margin-top:6px;
  font-size:12px
}

.random-btn{
  margin-top:18px;
  border:0;
  background:#333;
  color:#fff;
  border-radius:10px;
  padding:11px 22px;
  font-size:14px;
  font-weight:800
}

.history{
  margin-top:14px;
  color:#888;
  font-size:12px;
  text-align:center
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:#0007;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px
}

.modal-backdrop.open{
  display:flex
}

.modal{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 15px 50px #0005
}

.modal h3{
  margin:0 0 14px;
  font-size:16px
}

.form-row{
  margin-bottom:10px
}

.form-row label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:4px
}

.form-row input,
.form-row select{
  width:100%;
  height:36px;
  border:1px solid #ccc;
  border-radius:6px;
  padding:0 8px;
  font-size:13px
}

.inline{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  margin-top:16px
}

.picker-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(65px,1fr));
  gap:5px
}

.filter-pill{
  border:1px solid #ccc;
  background:#fff;
  border-radius:6px;
  padding:6px 3px;
  font-size:11px;
  text-align:center
}

.filter-pill.active{
  background:#333;
  color:#fff;
  border-color:#333
}

.custom-meals{
  border:1px solid #ddd;
  border-radius:8px;
  padding:8px
}

.custom-item{
  display:flex;
  gap:6px;
  align-items:center;
  margin:4px 0
}

.custom-item input{
  flex:1
}

.minus{
  width:26px;
  height:26px;
  border:0;
  background:#f0f0f0;
  border-radius:5px;
  color:#888;
  flex-shrink:0
}

.add-custom{
  border:1px dashed #bbb;
  background:#fff;
  border-radius:6px;
  padding:5px 8px;
  font-size:12px;
  margin-top:4px;
  width:100%
}

.yearmonth-picker{
  display:flex;
  gap:8px
}

.yearmonth-picker select{
  flex:1
}

.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#999;
  height:100%;
  gap:10px;
  padding:40px;
  text-align:center
}

.mobile-toggle-btn{
  display:none;
  width:100%;
  padding:8px;
  background:#f5f5f5;
  border:1px solid #ccc;
  border-radius:6px;
  font-weight:700;
  margin-bottom:8px;
  text-align:left;
  font-size:12px
}

.bottom-ad-area{
  width:100%;
  min-height:70px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  padding:0;
  overflow:hidden
}

.bottom-ad-pc{
  display:block;
  width:100%;
  max-width:970px;
  min-height:70px
}

.bottom-ad-mobile{
  display:none;
  width:100%;
  min-height:60px
}

.bottom-ad-area ins{
  display:block;
  width:100%
}

@media(max-width:768px){
  .topbar{
    padding:0 8px;
    height:48px
  }
  .logo{
    display:none
  }
  .auth-area span{
    display:none
  }
  .tab{
    padding:5px 8px;
    font-size:11px
  }
  .page{
    flex-direction:column
  }
  .mobile-toggle-btn{
    display:block
  }
  .sidebar,
  .random-side{
    width:100%;
    flex:none;
    border-right:0;
    border-bottom:1px solid #ddd;
    padding:10px;
    max-height:none
  }
  .sidebar-content,
  .random-side-content{
    display:none
  }
  .sidebar.open .sidebar-content,
  .random-side.open .random-side-content{
    display:block
  }
  .content-head{
    padding:8px 10px
  }
  .content-body{
    padding:8px 10px
  }
  .toolbar{
    gap:4px
  }
  .toolbar h2{
    font-size:14px
  }
  .toolbar .sub{
    display:none
  }
  .primary,
  .secondary{
    padding:5px 7px;
    font-size:11px
  }
  .calendar-wrap{
    padding:0
  }
  .calendar-head{
    padding:4px 2px
  }
  .month-title{
    font-size:14px;
    min-width:80px
  }
  .day{
    min-height:75px;
    padding:1px
  }
  .date-num{
    font-size:9.5px;
    margin-bottom:1px
  }
  .meal-group{
    margin-bottom:2px
  }
  .meal-group-header{
    font-size:9px;
    padding:.5px 2px
  }
  .meal-item{
    font-size:10px;
    padding:.5px 1px;
    letter-spacing:-.7px
  }
  .random-page{
    flex-direction:column
  }
  .random-main{
    padding:10px
  }
  .random-card{
    padding:15px
  }
  .random-card .big-title{
    font-size:17px
  }
  .bottom-ad-area{
    min-height:60px
  }
  .bottom-ad-pc{
    display:none
  }
  .bottom-ad-mobile{
    display:block;
    min-height:60px
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">🍳 식단 메모장</div>
      <div class="tabs">
        <button class="tab active" data-page="recipes">식단리스트</button>
        <button class="tab" data-page="calendar">월간식단</button>
        <button class="tab" data-page="ledger">가계부</button>
        <button class="tab" data-page="random">오늘 뭐먹지</button>
      </div>
    </div>
    <div class="auth-area">
      <span id="userStatus">비로그인</span>
      <button id="authBtn" class="secondary">로그인</button>
    </div>
  </div>
</header>

<main>

<section id="recipes" class="page active">
  <aside class="sidebar" id="recipeSidebar">
    <button class="mobile-toggle-btn" onclick="toggleSidebar('recipeSidebar')">
      📂 카테고리 메뉴 열기/접기
    </button>
    <div class="sidebar-content">
      <div class="section-title">카테고리 ▾</div>
      <div id="categoryTree"></div>
      <div class="edit-cats">
        <div class="section-title">카테고리 편집</div>
        <div style="display:flex;gap:4px">
          <button class="mini-btn" onclick="addCategory()">＋ 대분류</button>
          <button class="mini-btn" onclick="resetCategories()">기본값 복원</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="content">
    <div class="content-head">
      <div class="toolbar">
        <div>
          <h2>식단 리스트</h2>
          <div class="sub">등록한 요리를 한눈에 관리하세요.</div>
        </div>
        <div>
          <button class="primary" onclick="openRecipeModal()">＋ 요리등록</button>
        </div>
      </div>

      <div class="searchbox">
        <select id="searchType">
          <option value="name">요리명</option>
          <option value="ingredient">재료명</option>
        </select>
        <input id="searchInput" placeholder="요리명/재료명 검색">
        <button class="secondary" onclick="renderRecipes()">검색</button>
        <button class="secondary" onclick="clearSearch()">초기화</button>
      </div>
    </div>

    <div class="content-body">
      <div class="list-top">
        <span id="recipeCount" class="sub">총 0개</span>
        <select id="sortOrder" class="sort" onchange="renderRecipes()">
          <option value="new">최신순</option>
          <option value="old">오래된순</option>
        </select>
      </div>
      <div id="recipeList" class="recipe-list"></div>
      <div id="recipePagination" class="pagination"></div>
    </div>
  </div>
</section>

<section id="calendar" class="page">
  <div class="content">
    <div class="content-head">
      <div class="toolbar">
        <div>
          <h2>월간식단</h2>
          <div class="sub">날짜별 식단을 기록하고 이미지로 저장해 보세요.</div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button id="undoMealBtn" class="secondary" onclick="undoMealChange()" disabled>↶ 취소</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCj30whJRoLhym-tvpLDo8EeHrKo8m5T5E",
  authDomain: "meal-budget-journal-d0a66.firebaseapp.com",
  projectId: "meal-budget-journal-d0a66",
  storageBucket: "meal-budget-journal-d0a66.firebasestorage.app",
  messagingSenderId: "858161884252",
  appId: "1:858161884252:web:e7eaa031662e03e05d0a99"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

const defaultCategories = {
  "한식": ["메인요리", "반찬", "국/찌개", "한그릇요리"],
  "양식": ["에피타이저", "메인요리"],
  "중식": ["메인요리", "서브요리"],
  "일식": ["메인요리", "반찬", "국/찌개", "한그릇요리"],
  "디저트": ["빵", "쿠키", "설탕"],
  "음료": []
};

const CATEGORY_ORDER = ["한식", "양식", "중식", "일식", "디저트", "음료"];

const seedRecipes = [
  { id: crypto.randomUUID(), category: "한식", type: "메인요리", name: "닭볶음탕", spicy: "조금 매움", ingredients: "닭고기, 감자, 양파, 고추", link: "", created: Date.now() - 3000 },
  { id: crypto.randomUUID(), category: "한식", type: "반찬", name: "계란말이", spicy: "안매움", ingredients: "계란, 대파, 소금", link: "", created: Date.now() - 2000 },
  { id: crypto.randomUUID(), category: "일식", type: "한그릇요리", name: "규동", spicy: "안매움", ingredients: "소고기, 양파, 간장, 밥", link: "", created: Date.now() - 1000 }
];

const loadJSON = (key, fallback) => {
  try {
    const v = JSON.parse(localStorage.getItem(key) || "null");
    return v ?? fallback;
  } catch {
    return fallback;
  }
};

let currentUser = null;
let unsubscribeSnapshot = null;
let categories = loadJSON("dietCategories", structuredClone(defaultCategories));
let recipes = loadJSON("dietRecipes", structuredClone(seedRecipes));
let meals = loadJSON("dietMeals", {});
let customMealTypes = loadJSON("customMealTypes", []);

const spiceLevels = ["안매움", "매콤도 가능", "조금 매움", "많이 매움"];
let collapsed = {};
let selectedCategory = "전체";
let selectedType = null;
let recipePage = 1;
let currentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

let randomState = { category: "전체", type: null, spice: null, history: [] };
let mealUndoStack = [];
let mealRedoStack = [];

function orderedCategories(obj = categories) {
  return Object.keys(obj).sort((a, b) => {
    let ai = CATEGORY_ORDER.indexOf(a);
    let bi = CATEGORY_ORDER.indexOf(b);
    if (ai < 0) ai = 999;
    if (bi < 0) bi = 999;
    return ai - bi || a.localeCompare(b, "ko");
  });
}

function sortKorean(arr, key = "name") {
  return [...arr].sort((a, b) =>
    String(a[key] ?? "").localeCompare(String(b[key] ?? ""), "ko", { numeric: true, sensitivity: "base" })
  );
}

function normalizeUrl(v) {
  const s = String(v || "").trim();
  if (!s) return "";
  try {
    const u = new URL(s);
    return ["http:", "https:"].includes(u.protocol) ? u.href : "";
  } catch {
    return "";
  }
}

async function saveData() {
  localStorage.setItem("dietCategories", JSON.stringify(categories));
  localStorage.setItem("dietRecipes", JSON.stringify(recipes));
  localStorage.setItem("dietMeals", JSON.stringify(meals));
  localStorage.setItem("customMealTypes", JSON.stringify(customMealTypes));

  if (currentUser) {
    try {
      await setDoc(doc(db, "users", currentUser.uid), {
        categories, recipes, meals, customMealTypes, updatedAt: Date.now()
      });
    } catch (e) {
      console.error("Firestore sync failed:", e);
    }
  }
}

// 윈도우 전역 함수 등록
window.openModal = html => {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalBackdrop").classList.add("open");
};

window.closeModal = () => document.getElementById("modalBackdrop").classList.remove("open");

window.backdropClose = e => {
  if (e.target.id === "modalBackdrop") window.closeModal();
};

window.openAuthModal = () => window.openModal(`
  <h3>로그인 / 회원가입</h3>
  <div class="form-row">
    <label>이메일</label>
    <input id="authEmail" type="email" placeholder="email@example.com">
  </div>
  <div class="form-row">
    <label>비밀번호</label>
    <input id="authPw" type="password" placeholder="비밀번호 입력">
  </div>
  <div class="modal-actions">
    <button class="secondary" onclick="closeModal()">취소</button>
    <button class="secondary" onclick="handleSignUp()">회원가입</button>
    <button class="primary" onclick="handleSignIn()">로그인</button>
  </div>
  <hr style="margin:15px 0;border:0;border-top:1px solid #eee">
  <button class="google-btn" onclick="handleGoogleSignIn()">
    🌐 Google 계정으로 로그인
  </button>
`);

window.handleSignIn = async () => {
  const e = document.getElementById("authEmail").value;
  const p = document.getElementById("authPw").value;
  try {
    await signInWithEmailAndPassword(auth, e, p);
    window.closeModal();
  } catch (err) {
    alert("로그인 실패: " + err.message);
  }
};

window.handleSignUp = async () => {
  const e = document.getElementById("authEmail").value;
  const p = document.getElementById("authPw").value;
  try {
    await createUserWithEmailAndPassword(auth, e, p);
    window.closeModal();
    alert("회원가입 완료!");
  } catch (err) {
    alert("회원가입 실패: " + err.message);
  }
};

window.handleGoogleSignIn = async () => {
  try {
    await signInWithPopup(auth, googleProvider);
    window.closeModal();
  } catch (err) {
    alert("구글 로그인 실패: " + err.message);
  }
};

onAuthStateChanged(auth, user => {
  currentUser = user;
  const s = document.getElementById("userStatus");
  const b = document.getElementById("authBtn");

  if (unsubscribeSnapshot) {
    unsubscribeSnapshot();
    unsubscribeSnapshot = null;
  }

  if (user) {
    s.textContent = user.email || user.displayName || "로그인됨";
    b.textContent = "로그아웃";
    b.onclick = () => signOut(auth);

    unsubscribeSnapshot = onSnapshot(doc(db, "users", user.uid), snap => {
      if (snap.exists()) {
        const d = snap.data();
        if (d.categories) categories = d.categories;
        if (d.recipes) recipes = d.recipes;
        if (d.meals) meals = d.meals;
        if (d.customMealTypes) customMealTypes = d.customMealTypes;
        refreshAllViews();
      } else {
        saveData();
      }
    }, e => {
      console.warn("Firestore 접근 제한:", e.message);
    });
  } else {
    s.textContent = "비로그인";
    b.textContent = "로그인";
    b.onclick = window.openAuthModal;

    categories = loadJSON("dietCategories", structuredClone(defaultCategories));
    recipes = loadJSON("dietRecipes", structuredClone(seedRecipes));
    meals = loadJSON("dietMeals", {});
    customMealTypes = loadJSON("customMealTypes", []);
    refreshAllViews();
  }
});

function refreshAllViews() {
  renderCategoryTree();
  renderRecipes();
  renderCalendar();
  renderRandomFilters();
  updateMealHistoryButtons();
}

window.toggleSidebar = id => document.getElementById(id)?.classList.toggle("open");
window.saveData = saveData;

window.esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
}[m]));

window.spicyEmoji = level => ({
  "안매움": "", "매콤도 가능": "🌶️", "조금 매움": "🌶️🌶️", "많이 매움": "🌶️🌶️🌶️"
}[level] || "");

function switchTab(pageId) {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
  
  const targetTab = document.querySelector(`.tab[data-page="${pageId}"]`);
  const targetPage = document.getElementById(pageId);
  
  if (targetTab && targetPage) {
    targetTab.classList.add("active");
    targetPage.classList.add("active");
    location.hash = pageId;
    localStorage.setItem("activeTab", pageId);

    if (pageId === "recipes") renderRecipes();
    if (pageId === "calendar") renderCalendar();
    if (pageId === "random") renderRandomFilters();
  }
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    switchTab(btn.dataset.page);
  });
});

window.renderCategoryTree = () => {
  const box = document.getElementById("categoryTree");
  if (!box) return;
  box.innerHTML = "";

  ["전체", ...orderedCategories()].forEach(cat => {
    const row = document.createElement("div");
    row.className = "category-row";

    const b = document.createElement("button");
    b.className = `category-btn ${selectedCategory === cat ? "selected" : ""}`;
    b.innerHTML = cat === "전체" ? window.esc(cat) : `<span class="chev">${collapsed[cat] ? "▶" : "▼"}</span>${window.esc(cat)}`;
    b.onclick = () => selectCategory(cat);

    row.appendChild(b);
    box.appendChild(row);

    if (cat !== "전체" && !collapsed[cat]) {
      const sub = document.createElement("div");
      sub.className = "subcats";

      (categories[cat] || []).forEach(t => {
        const sb = document.createElement("button");
        sb.className = `subcat-btn ${selectedCategory === cat && selectedType === t ? "selected" : ""}`;
        sb.textContent = t;
        sb.onclick = () => {
          selectedCategory = cat;
          selectedType = t;
          recipePage = 1;
          renderCategoryTree();
          renderRecipes();
        };
        sub.appendChild(sb);
      });
      box.appendChild(sub);
    }
  });
};

window.selectCategory = cat => {
  if (cat === "전체") {
    selectedCategory = "전체";
    selectedType = null;
  } else {
    selectedCategory = cat;
    selectedType = null;
    collapsed[cat] = !collapsed[cat];
  }
  recipePage = 1;
  renderCategoryTree();
  renderRecipes();
};

window.addCategory = () => {
  const n = prompt("추가할 대분류 이름을 입력하세요.");
  if (!n?.trim() || categories[n.trim()]) return;
  categories[n.trim()] = [];
  saveData();
  renderCategoryTree();
};

window.resetCategories = () => {
  if (confirm("카테고리를 기본값으로 복원할까요?")) {
    categories = structuredClone(defaultCategories);
    saveData();
    renderCategoryTree();
    renderRecipes();
  }
};

window.openRecipeModal = (editId = null) => {
  const r = recipes.find(x => x.id === editId);
  const cat = r?.category || (selectedCategory === "전체" ? "한식" : selectedCategory);
  const type = r?.type || (categories[cat]?.[0] || "");

  window.openModal(`
    <h3>${r ? "요리 수정" : "요리 등록"}</h3>
    <div class="inline">
      <div class="form-row">
        <label>카테고리</label>
        <select id="rCat">
          ${orderedCategories().map(c => `
            <option value="${window.esc(c)}" ${c === cat ? "selected" : ""}>
              ${window.esc(c)}
            </option>
          `).join("")}
        </select>
      </div>
      <div class="form-row">
        <label>종류</label>
        <select id="rType"></select>
      </div>
    </div>
    <div class="form-row">
      <label>요리 이름</label>
      <input id="rName" value="${window.esc(r?.name || "")}" placeholder="예: 김치찌개">
    </div>
    <div class="form-row">
      <label>맵기 정도</label>
      <select id="rSpice">
        ${spiceLevels.map(s => `
          <option ${s === (r?.spicy || "안매움") ? "selected" : ""}>${s}</option>
        `).join("")}
      </select>
    </div>
    <div class="form-row">
      <label>재료</label>
      <input id="rIng" value="${window.esc(r?.ingredients || "")}" placeholder="예: 돼지고기, 김치, 대파">
    </div>
    <div class="form-row">
      <label>레시피 링크</label>
      <input id="rLink" type="url" value="${window.esc(r?.link || "")}" placeholder="https://example.com/recipe">
    </div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">취소</button>
      <button class="primary" onclick="saveRecipe('${editId || ""}')">${r ? "수정" : "등록"}</button>
    </div>
  `);

  const sel = document.getElementById("rCat");
  const typeSel = document.getElementById("rType");

  function sync() {
    typeSel.innerHTML = (categories[sel.value] || []).map(t => `
      <option value="${window.esc(t)}" ${t === type ? "selected" : ""}>
        ${window.esc(t)}
      </option>
    `).join("");
  }
  sel.addEventListener("change", sync);
  sync();
};

window.saveRecipe = id => {
  const category = document.getElementById("rCat").value;
  const type = document.getElementById("rType").value;
  const name = document.getElementById("rName").value.trim();
  const spicy = document.getElementById("rSpice").value;
  const ingredients = document.getElementById("rIng").value.trim();
  const rawLink = document.getElementById("rLink").value.trim();
  const link = normalizeUrl(rawLink);

  if (!name) {
    alert("요리 이름을 입력해주세요.");
    return;
  }
  if (rawLink && !link) {
    alert("레시피 링크는 http:// 또는 https://로 시작하는 주소를 입력해주세요.");
    return;
  }

  if (id) {
    const r = recipes.find(x => x.id === id);
    Object.assign(r, { category, type, name, spicy, ingredients, link });
  } else {
    recipes.push({
      id: crypto.randomUUID(), category, type, name, spicy, ingredients, link, created: Date.now()
    });
  }

  saveData();
  window.closeModal();
  renderRecipes();
};

window.deleteRecipe = id => {
  if (confirm("이 요리를 삭제할까요?")) {
    recipes = recipes.filter(r => r.id !== id);
    saveData();
    renderRecipes();
  }
};

window.renderRecipes = () => {
  renderCategoryTree();
  const q = document.getElementById("searchInput")?.value.trim().toLowerCase() || "";
  const st = document.getElementById("searchType")?.value || "name";

  let arr = recipes.filter(r =>
    (selectedCategory === "전체" || r.category === selectedCategory) &&
    (selectedType == null || r.type === selectedType)
  );

  if (q) {
    arr = arr.filter(r => String(st === "name" ? r.name : r.ingredients || "").toLowerCase().includes(q));
  }

  arr.sort((a, b) => document.getElementById("sortOrder")?.value === "new" ? b.created - a.created : a.created - b.created);

  const per = 6;
  const total = Math.max(1, Math.ceil(arr.length / per));
  recipePage = Math.min(recipePage, total);
  const slice = arr.slice((recipePage - 1) * per, recipePage * per);

  document.getElementById("recipeCount").textContent = `총 ${arr.length}개`;
  const list = document.getElementById("recipeList");

  list.innerHTML = slice.length ? slice.map(r => `
    <article class="recipe-card">
      <div class="recipe-title">${window.esc(r.name)}</div>
      <div class="spicy">${window.spicyEmoji(r.spicy)}</div>
      <div class="recipe-meta">
        <strong>${window.esc(r.category)} · ${window.esc(r.type)}</strong> · ${window.esc(r.spicy)}
      </div>
      <div class="ingredients">🥕 ${window.esc(r.ingredients || "재료 미입력")}</div>
      ${r.link ? `<a class="recipe-link" href="${window.esc(r.link)}" target="_blank" rel="noopener noreferrer">🔗 레시피 보기</a>` : ""}
      <div class="card-actions">
        <button onclick="openRecipeModal('${r.id}')">수정</button>
        <button onclick="deleteRecipe('${r.id}')">삭제</button>
      </div>
    </article>
  `).join("") : `<div class="empty" style="grid-column:1/-1">조건에 맞는 요리가 없어요.</div>`;

  document.getElementById("recipePagination").innerHTML = Array.from({ length: total }, (_, i) =>
    `<button class="${i + 1 === recipePage ? "current" : ""}" onclick="setPage(${i + 1})">${i + 1}</button>`
  ).join("");
};

window.setPage = p => {
  recipePage = p;
  renderRecipes();
};

window.clearSearch = () => {
  document.getElementById("searchInput").value = "";
  recipePage = 1;
  renderRecipes();
};

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function formatMonth(d) {
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
}

const fixedSlotOrder = ["도시락", "아침", "점심", "저녁"];

window.renderCalendar = () => {
  const title = document.getElementById("monthTitle");
  if (!title) return;
  title.textContent = formatMonth(currentMonth);

  const grid = document.getElementById("calendarGrid");
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m + 1, 0);
  const start = first.getDay();
  const days = last.getDate();

  let h = ["일", "월", "화", "수", "목", "금", "토"].map(x => `<div class="dow">${x}</div>`).join("");

  for (let i = 0; i < start; i++) {
    h += `<div class="day"></div>`;
  }

  const today = formatDate(new Date());

  for (let n = 1; n <= days; n++) {
    const date = new Date(y, m, n);
    const key = formatDate(date);
    const list = meals[key] || [];
    const grouped = {};

    list.forEach((x, origIdx) => {
      const slot = x.slot || "기타";
      (grouped[slot] ??= []).push({ name: x.name, origIdx });
    });

    const sortedSlots = Object.keys(grouped).sort((a, b) => {
      let ia = fixedSlotOrder.indexOf(a);
      let ib = fixedSlotOrder.indexOf(b);
      if (ia < 0) ia = 99;
      if (ib < 0) ib = 99;
      return ia - ib || a.localeCompare(b, "ko");
    });

    let dayHtml = "";
    sortedSlots.forEach(slot => {
      const cls = slot === "아침" ? "meal-breakfast" : slot === "점심" ? "meal-lunch" : slot === "저녁" ? "meal-dinner" : "meal-custom";
      dayHtml += `
        <div class="meal-group" onclick="event.stopPropagation(); openMealModal('${key}', '${window.esc(slot)}')">
          <div class="meal-group-header ${cls}">${window.esc(slot)}</div>
          <div class="meal-group-body ${cls}">
            ${grouped[slot].map(item => `
              <div class="meal-item ${recipes.some(r => r.name === item.name) ? "registered" : ""}">
                <span class="meal-item-text" title="${window.esc(item.name)}">${window.esc(item.name)}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    });

    h += `
      <div class="day ${key === today ? "today" : ""}" onclick="openMealModal('${key}')">
        <div class="date-num">${n}</div>
        ${dayHtml}
      </div>
    `;
  }
  grid.innerHTML = h;
};

window.changeMonth = n => {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + n, 1);
  renderCalendar();
};

window.goToday = () => {
  const d = new Date();
  currentMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  renderCalendar();
};

window.openMonthModal = () => {
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();

  window.openModal(`
    <h3>원하는 월로 이동</h3>
    <div class="yearmonth-picker">
      <select id="pickYear">
        ${Array.from({ length: 11 }, (_, i) => {
          let yy = y - 5 + i;
          return `<option ${yy === y ? "selected" : ""}>${yy}</option>`;
        }).join("")}
      </select>
      <select id="pickMonth">
        ${Array.from({ length: 12 }, (_, i) => `
          <option value="${i}" ${i === m ? "selected" : ""}>${i + 1}월</option>
        `).join("")}
      </select>
    </div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">취소</button>
      <button class="primary" onclick="jumpMonth()">이동</button>
    </div>
  `);
};

window.jumpMonth = () => {
  currentMonth = new Date(+document.getElementById("pickYear").value, +document.getElementById("pickMonth").value, 1);
  window.closeModal();
  renderCalendar();
};

window.downloadCalendarImage = () => {
  const t = document.getElementById("calendarCaptureArea");
  html2canvas(t, { scale: 2, backgroundColor: "#fff" }).then(c => {
    const a = document.createElement("a");
    a.download = `식단_${currentMonth.getFullYear()}년_${currentMonth.getMonth() + 1}월.png`;
    a.href = c.toDataURL("image/png");
    a.click();
  }).catch(e => alert("이미지 저장 중 오류가 발생했습니다: " + e.message));
};

window._mealFormDate = formatDate(new Date());
window._mealSlot = "도시락";
window._mealInputMode = "direct";
window._mealSelectedRecipeIds = [];

window.openMealModal = (targetDate = null, targetSlot = null) => {
  const today = formatDate(new Date());
  const savedDate = targetDate || window._mealFormDate || today;
  const savedSlot = targetSlot || window._mealSlot || "도시락";

  window._mealSlot = savedSlot;
  window._mealFormDate = savedDate;
  window._mealSelectedRecipeIds = [];

  window.openModal(`
    <h3>식단 수정 / 추가</h3>
    <div class="form-row">
      <label>날짜</label>
      <input id="mDate" type="date" value="${savedDate}" onchange="window._mealFormDate=this.value">
    </div>
    <div class="form-row">
      <label>식사 항목</label>
      <div id="mealSlotButtons" class="picker-grid">
        ${["도시락", "아침", "점심", "저녁"].map(x => `
          <button type="button" class="filter-pill ${savedSlot === x ? "active" : ""}" onclick="selectMealSlot(this, '${window.esc(x)}')">${x}</button>
        `).join("")}
      </div>
    </div>
    <div class="form-row">
      <label>기타 추가 항목</label>
      <div class="custom-meals" id="customMeals">
        ${customMealTypes.map((x, i) => `
          <div class="custom-item">
            <button type="button" class="minus" onclick="removeCustomType(${i})">−</button>
            <span style="flex:1">${window.esc(x)}</span>
            <button type="button" class="filter-pill ${savedSlot === x ? "active" : ""}" onclick="selectMealSlot(this, '${window.esc(x)}')">${window.esc(x)}</button>
          </div>
        `).join("")}
        <button type="button" class="add-custom" onclick="addCustomType()">＋ 기타 항목 추가</button>
      </div>
    </div>
    <div class="form-row">
      <label>요리 이름</label>
      <div class="picker-grid" style="grid-template-columns:1fr 1fr;margin-bottom:8px">
        <button type="button" id="mealModeDirect" class="filter-pill ${window._mealInputMode !== "list" ? "active" : ""}" onclick="setMealInputMode('direct')">직접 입력</button>
        <button type="button" id="mealModeList" class="filter-pill ${window._mealInputMode === "list" ? "active" : ""}" onclick="setMealInputMode('list')">등록 요리에서 선택</button>
      </div>
      <div id="mealDirectBox" style="display:${window._mealInputMode === "list" ? "none" : "block"}">
        <div id="directMealRows"></div>
        <button type="button" class="add-custom" onclick="addDirectMealRow('')">＋ 요리 추가</button>
      </div>
      <div id="mealListBox" style="display:${window._mealInputMode === "list" ? "block" : "none"}">
        <div class="inline" style="margin-bottom:8px">
          <select id="mCat" onchange="updateMealTypeOptions(this.value)">
            ${orderedCategories().map(c => `<option value="${window.esc(c)}">${window.esc(c)}</option>`).join("")}
          </select>
          <select id="mType" onchange="updateMealRecipeList()"></select>
        </div>
        <select id="mRecipeSelect" style="width:100%;height:36px;border:1px solid #ccc;border-radius:6px;padding:0 8px">
          <option value="">요리를 선택하세요</option>
        </select>
        <button type="button" class="add-custom" onclick="addSelectedRecipe()" style="margin-top:6px">＋ 선택 요리 담기</button>
        <div id="selectedRecipeRows" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="secondary" onclick="closeModal()">취소</button>
      <button type="button" class="primary" onclick="saveMeal()">저장</button>
    </div>
  `);

  const existing = (meals[savedDate] || []).filter(m => m.slot === savedSlot);

  if (window._mealInputMode === "direct") {
    if (existing.length) {
      existing.forEach(m => addDirectMealRow(m.name));
    } else {
      addDirectMealRow();
    }
  }

  updateMealTypeOptions(document.getElementById("mCat")?.value || orderedCategories()[0] || "한식");

  if (window._mealInputMode === "list") {
    existing.forEach(m => {
      const r = recipes.find(x => x.name === m.name);
      if (r) window._mealSelectedRecipeIds.push(r.id);
    });
    renderSelectedRecipeRows();
  }
};

window.selectMealSlot = (btn, slot) => {
  document.querySelectorAll("#mealSlotButtons .filter-pill, #customMeals .filter-pill").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  window._mealSlot = slot;

  const date = document.getElementById("mDate")?.value || window._mealFormDate;
  const box = document.getElementById("directMealRows");

  if (box && window._mealInputMode === "direct") {
    box.innerHTML = "";
    const ex = (meals[date] || []).filter(m => m.slot === slot);
    if (ex.length) {
      ex.forEach(m => addDirectMealRow(m.name));
    } else {
      addDirectMealRow();
    }
  }
};

window.addCustomType = () => {
  const n = prompt("추가할 항목 이름을 입력하세요. (예: 간식, 야식)");
  if (!n?.trim() || customMealTypes.includes(n.trim())) return;
  customMealTypes.push(n.trim());
  saveData();
  openMealModal(window._mealFormDate, window._mealSlot);
};

window.removeCustomType = i => {
  customMealTypes.splice(i, 1);
  saveData();
  openMealModal(window._mealFormDate, window._mealSlot);
};

window.setMealInputMode = mode => {
  window._mealInputMode = mode;
  document.getElementById("mealDirectBox").style.display = mode === "direct" ? "block" : "none";
  document.getElementById("mealListBox").style.display = mode === "list" ? "block" : "none";
  document.getElementById("mealModeDirect").classList.toggle("active", mode === "direct");
  document.getElementById("mealModeList").classList.toggle("active", mode === "list");

  if (mode === "list") updateMealRecipeList();
};

window.addDirectMealRow = (val = "") => {
  const box = document.getElementById("directMealRows");
  if (!box) return;

  const row = document.createElement("div");
  row.className = "custom-item";

  const input = document.createElement("input");
  input.className = "direct-meal-input";
  input.value = val;
  input.placeholder = "요리 이름 입력";
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      addDirectMealRow("");
    }
  });

  const del = document.createElement("button");
  del.type = "button";
  del.className = "minus";
  del.textContent = "−";
  del.onclick = () => row.remove();

  row.append(input, del);
  box.appendChild(row);
  if (!val) input.focus();
};

window.updateMealTypeOptions = cat => {
  const s = document.getElementById("mType");
  if (!s) return;
  s.innerHTML = `<option value="">전체 종류</option>` + (categories[cat] || []).map(t => `
    <option value="${window.esc(t)}">${window.esc(t)}</option>
  `).join("");
  updateMealRecipeList();
};

window.updateMealRecipeList = () => {
  const cat = document.getElementById("mCat")?.value;
  const type = document.getElementById("mType")?.value;
  const sel = document.getElementById("mRecipeSelect");
  if (!sel) return;

  let arr = recipes.filter(r => r.category === cat && (!type || r.type === type));
  arr = sortKorean(arr);

  sel.innerHTML = `<option value="">요리를 선택하세요</option>` + arr.map(r => `
    <option value="${r.id}">${window.esc(r.name)}</option>
  `).join("");
};

function renderSelectedRecipeRows() {
  const box = document.getElementById("selectedRecipeRows");
  if (!box) return;
  box.innerHTML = "";

  window._mealSelectedRecipeIds.forEach(id => {
    const r = recipes.find(x => x.id === id);
    if (!r) return;

    const item = document.createElement("div");
    item.className = "custom-item";
    item.innerHTML = `
      <span style="flex:1">🍳 ${window.esc(r.name)}</span>
      <button type="button" class="minus" onclick="removeSelectedRecipe('${id}')">−</button>
    `;
    box.appendChild(item);
  });
}

window.addSelectedRecipe = () => {
  const id = document.getElementById("mRecipeSelect")?.value;
  if (!id || window._mealSelectedRecipeIds.includes(id)) return;
  window._mealSelectedRecipeIds.push(id);
  renderSelectedRecipeRows();
  document.getElementById("mRecipeSelect").value = "";
};

window.removeSelectedRecipe = id => {
  window._mealSelectedRecipeIds = window._mealSelectedRecipeIds.filter(x => x !== id);
  renderSelectedRecipeRows();
};

window.saveMeal = () => {
  const date = document.getElementById("mDate").value;
  window._mealFormDate = date;

  let names = window._mealInputMode === "list"
    ? window._mealSelectedRecipeIds.map(id => recipes.find(r => r.id === id)?.name).filter(Boolean)
    : [...document.querySelectorAll(".direct-meal-input")].map(i => i.value.trim()).filter(Boolean);

  if (!date) {
    alert("날짜를 선택해 주세요.");
    return;
  }

  pushMealHistory();
  if (!meals[date]) meals[date] = [];
  meals[date] = meals[date].filter(m => m.slot !== window._mealSlot);

  names.forEach(name => meals[date].push({ slot: window._mealSlot, name }));
  if (!meals[date].length) delete meals[date];

  saveData();
  window.closeModal();
  renderCalendar();
};

function pushMealHistory() {
  mealUndoStack.push(JSON.parse(JSON.stringify(meals)));
  if (mealUndoStack.length > 30) mealUndoStack.shift();
  mealRedoStack = [];
  updateMealHistoryButtons();
}

function updateMealHistoryButtons() {
  const undo = document.getElementById("undoMealBtn");
  const redo = document.getElementById("redoMealBtn");
  if (undo) undo.disabled = !mealUndoStack.length;
  if (redo) redo.disabled = !mealRedoStack.length;
}

window.undoMealChange = () => {
  if (!mealUndoStack.length) return;
  mealRedoStack.push(JSON.parse(JSON.stringify(meals)));
  meals = mealUndoStack.pop();
  saveData();
  renderCalendar();
  updateMealHistoryButtons();
};

window.redoMealChange = () => {
  if (!mealRedoStack.length) return;
  mealUndoStack.push(JSON.parse(JSON.stringify(meals)));
  meals = mealRedoStack.pop();
  saveData();
  renderCalendar();
  updateMealHistoryButtons();
};

window.renderRandomFilters = () => {
  const cbox = document.getElementById("randomCategories");
  if (!cbox) return;

  cbox.innerHTML = ["전체", ...orderedCategories()].map(c => `
    <button class="filter-pill ${randomState.category === c ? "active" : ""}" onclick="setRandomCategory('${window.esc(c)}')">
      ${window.esc(c)}
    </button>
  `).join("");

  const tbox = document.getElementById("randomTypes");
  if (randomState.category === "전체") {
    tbox.innerHTML = '<div class="sub" onclick="alert(\'카테고리를 먼저 설정해주세요\')" style="cursor:pointer;padding:8px 0">카테고리를 먼저 설정해주세요</div>';
  } else {
    tbox.innerHTML = (categories[randomState.category] || []).map(t => `
      <button class="filter-pill ${randomState.type === t ? "active" : ""}" style="display:block;width:100%;margin:4px 0;text-align:left" onclick="setRandomType('${window.esc(t)}')">
        ${window.esc(t)}
      </button>
    `).join("");
  }

  document.getElementById("randomSpicy").innerHTML = spiceLevels.map(s => `
    <button class="filter-pill ${randomState.spice === s ? "active" : ""}" style="display:block;width:100%;margin:4px 0;text-align:left" onclick="setRandomSpice('${window.esc(s)}')">
      ${window.spicyEmoji(s) || "▫️"} ${window.esc(s)}
    </button>
  `).join("");
};

window.setRandomCategory = c => {
  randomState.category = c;
  randomState.type = null;
  renderRandomFilters();
};

window.setRandomType = t => {
  if (randomState.category === "전체") {
    alert("카테고리를 먼저 설정해주세요");
    return;
  }
  randomState.type = randomState.type === t ? null : t;
  renderRandomFilters();
};

window.setRandomSpice = s => {
  randomState.spice = randomState.spice === s ? null : s;
  renderRandomFilters();
};

window.drawRandom = () => {
  let arr = recipes.filter(r => randomState.category === "전체" || r.category === randomState.category);

  if (randomState.category !== "전체" && randomState.type) {
    arr = arr.filter(r => r.type === randomState.type);
  }
  if (randomState.spice) {
    arr = arr.filter(r => r.spicy === randomState.spice);
  }

  if (!arr.length) {
    alert("조건에 맞는 요리가 없습니다.");
    return;
  }

  const r = arr[Math.floor(Math.random() * arr.length)];
  randomState.history.unshift(r.name);
  randomState.history = randomState.history.slice(0, 5);

  document.getElementById("randomCard").innerHTML = `
    <div class="emoji">${window.spicyEmoji(r.spicy) || "🍽️"}</div>
    <div class="big-title">${window.esc(r.name)}</div>
    <div class="small-meta">${window.esc(r.category)} · ${window.esc(r.type)} · ${window.esc(r.spicy)}</div>
    <div class="small-meta">재료: ${window.esc(r.ingredients || "미입력")}</div>
  `;

  document.getElementById("randomHistory").textContent = "최근 추천: " + randomState.history.join(" · ");
};

// 초기 로드시 이전에 머물던 탭 복원
const initialTab = location.hash.replace('#', '') || localStorage.getItem("activeTab") || "recipes";
switchTab(initialTab);
refreshAllViews();
</script>

</div>
